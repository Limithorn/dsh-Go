# 4g：2560m 对这么大的工程偏小，编译期会反复 GC。机器有 47G，给得起。
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# 这台机器上 Kotlin 编译 daemon 的 RMI 连接会被重置：
#   java.net.SocketException: Connection reset
#   在 compileWithDaemon → StreamRemoteCall.executeCall
# 于是每轮编译都要先等它超时、再 fallback 到进程内编译，看起来就是"卡住"。
# （本机开着 127.0.0.1 端口的代理，Defender 也在实时扫描，很可能其中之一
# 断了本地 socket。）
# 用 daemon（快：编译进程跨次复用）。前提是本地回环不走代理——见
# build_apk.sh 里的 NO_PROXY。如果哪天又出现 Connection reset / 卡住，
# 把下面这行改成 in-process 兜底。
kotlin.compiler.execution.strategy=daemon
kotlin.daemon.jvmargs=-Xmx3g
# Flutter's plugin otherwise fills defaultConfig's abiFilters with every ABI it
# supports, and a flavor's filter only adds to that: the arm64 APK carried
# armeabi-v7a and x86_64 plugin libraries with no Flutter engine beside them.
disable-abi-filtering=true


# ── 加速 ────────────────────────────────────────────────────────────
# 并行执行模块任务。这是一个多插件工程（几十个 Flutter 插件），串行跑
# 每个插件的 compileKotlin 是主要浪费——机器多核，模块之间没有依赖。
org.gradle.parallel=true

# 构建缓存：跨次复用未变任务的输出。改一个 Kotlin 文件不该重跑
# 所有插件的编译。
org.gradle.caching=true

# 按需配置：只配置本次要跑的 task 涉及的模块。
org.gradle.configureondemand=true

# 给 Gradle 的编译任务更多内存，避免 Kotlin 编译在进程内模式下 OOM。
org.gradle.workers.max=8
